<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDM Free Training</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RDM FREE TRAINING: the VSL page (DRAFT 2026-09-16)
   The video, and an Apply button under it. Nothing else.
   ⚠️ THIS IS THE REAL VSL, NOT A PLACEHOLDER (Anthony, 2026-09-16: "that video is actually
   my current VSL"). YouTube id frtsmNH29Lc. Three places in this repo used to call it a
   stand-in for a sales VSL that was never filmed, and all three were wrong. Nothing to swap.
   ============================================================ */
:root{
  --purple:#96318d; --purple-deep:#792671; --blue:#06aeb9; --blue-deep:#058890; --orange:#d35400; --tan:#fff0d3;
  --b:3px solid #000; --rad:20px; --shadow:5px 5px 0 rgba(0,0,0,0.30);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Ubuntu,Helvetica,Arial,sans-serif;background:var(--purple);color:#fff;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img{max-width:100%;height:auto;display:block;}
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(rgba(18,4,18,.52),rgba(18,4,18,.72)),url('Background%203.png') center/cover no-repeat;background-color:var(--purple);}
.site{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:center;min-height:64px;padding:12px;border-bottom:var(--b);background:var(--purple);}
.topbar img{height:34px;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:22px 18px 26px;}
.wrap{width:100%;max-width:960px;text-align:center;}
.eyebrow{display:inline-block;background:var(--orange);color:#fff;border:var(--b);font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 16px;border-radius:999px;margin-bottom:16px;text-shadow:0 1px 1px rgba(0,0,0,.3);}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:var(--b);border-radius:var(--rad);box-shadow:var(--shadow);overflow:hidden;}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.btn{display:inline-block;margin-top:22px;text-align:center;text-decoration:none;cursor:pointer;font-family:inherit;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35);
  background:var(--orange);border:var(--b);border-radius:var(--rad);padding:16px 44px;font-size:1.15rem;font-weight:700;box-shadow:var(--shadow);transition:transform .14s,box-shadow .14s;}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 rgba(0,0,0,.30);}
.btn small{display:block;font-size:.82rem;font-weight:400;opacity:.92;margin-top:3px;}
@media (max-width:560px){ .btn{display:block;padding:15px 20px;} }
/* Purple band, matching the top bar and coaching.html (Anthony, 2026-09-16). */
footer{text-align:center;padding:10px 12px;font-size:.74rem;color:rgba(255,255,255,.72);
  background:var(--purple);border-top:var(--b);}
footer a{color:#fff;}
</style>
<script src="analytics.js"></script>
</head>
<body>
<div class="bg-fx" aria-hidden="true"></div>
<div class="site">
  <div class="topbar"><a href="index.html"><img src="Steller%20Drums%20-%20PNG%20file-07.png" alt="RDM"></a></div>
  <main>
    <div class="wrap">
      <span class="eyebrow">Free training</span>
      <div class="video">
        <iframe src="https://www.youtube.com/embed/frtsmNH29Lc?rel=0&modestbranding=1" title="RDM free training"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
      <a class="btn" href="academy-application.html" data-track="academy_apply_click">Apply for coaching &rarr;<small>Application, then a call with Anthony</small></a>
    </div>
  </main>
  <footer>&copy; 2026 RDM: Rudimental Drumming Mastery</footer>
</div>
</body>
</html>
